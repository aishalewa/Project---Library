<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <main>
        <div class="container">

        </div>
        <button id="submit-btn" type="button" form="add-book">Add new book</button>
    </main>

    <!-- title, author, pages, isread -->

    <form action="#" id="add-book">

        <label for="title"> Enter Title: </label> <br>
        <input type="text" id="title" name="title" value="let me be"><br>

        <label for="author"> Enter Author:</label> <br>
        <input type="text" id="author" name="author" value=""> <br>

        <label for="pages"> Enter Pages:</label><br>
        <input type="number" id="pages" name="pages" value=""> <br>

        <label for="is_read"> Have you read the book? <br>
        <input type="checkbox" id="is_read" name="is-read"> <br> 
        
    </form>

    <script src="script.js"></script>
</body>
</html>
